# Copy to checks.yml. Only PUBLIC addresses: this machine is not inside your Open edX server.
# Schema: id, name, group, kind (http|tcp|mysql|mongo|redis|ssl), target, interval (s), timeout (s), critical.
checks:
  - {id: lms,    name: LMS,                    group: Open edX, kind: http, target: "https://lms.example.com/heartbeat",    interval: 60, timeout: 10}
  - {id: studio, name: Studio (CMS),           group: Open edX, kind: http, target: "https://studio.example.com/heartbeat", interval: 60, timeout: 10}
  - {id: web,    name: Public website,         group: Open edX, kind: http, target: "https://lms.example.com/",             interval: 60, timeout: 10}
  - {id: mfe,    name: Learning micro-frontends, group: Open edX, kind: http, target: "https://apps.lms.example.com/learning/", interval: 60, timeout: 10}
  - {id: tls,    name: TLS certificate,        group: Open edX, kind: ssl,  target: "lms.example.com:443", interval: 3600, timeout: 10, critical: false}
  # Databases cannot be checked from outside without exposing them. Either leave the "Databases" group out
  # (an outage still shows up through the LMS/Studio checks) or reach them over a VPN/private network:
  # - {id: mysql, name: MySQL, group: Databases, kind: tcp, target: "db.internal.example.com:3306", interval: 60}
