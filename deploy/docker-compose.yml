# Standalone deployment of the Open edX status page.
# Runs OUTSIDE the Tutor stack (own compose project, own TLS), so `tutor local stop/restart/upgrade`
# or an Open edX outage never takes it down. For a full-server outage, run it on a DIFFERENT machine.
name: openedx-status

services:
  status-api:
    image: ghcr.io/abstract-tech/openedx-status-api:${STATUS_API_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: .env  # lets `password_env: SOME_VAR` in checks.yml read SOME_VAR from .env
        required: false
    environment:
      STATUS_TITLE: "${STATUS_TITLE:-Open edX status}"
      STATUS_HOST: "0.0.0.0"  # listen address; set here so .env can never change it
      STATUS_PORT: "8000"
      STATUS_CHECKS_FILE: /config/checks.yml
      STATUS_DATA_DIR: /data
      STATUS_FAIL_THRESHOLD: "${STATUS_FAIL_THRESHOLD:-3}"
      STATUS_RETENTION_DAYS: "${STATUS_RETENTION_DAYS:-90}"
    volumes:
      - ./checks.yml:/config/checks.yml:ro
      - status-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  status-web:
    image: ghcr.io/abstract-tech/openedx-status-web:${STATUS_WEB_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - status-cache:/var/cache/status-cache  # last good API answer survives a restart of this container
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # TLS front door (automatic Let's Encrypt). Skip this service and publish status-web yourself if you
  # already have a reverse proxy.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${STATUS_BIND:-0.0.0.0}:${STATUS_HTTP_PORT:-80}:80"
      - "${STATUS_BIND:-0.0.0.0}:${STATUS_HTTPS_PORT:-443}:443"
      - "${STATUS_BIND:-0.0.0.0}:${STATUS_HTTPS_PORT:-443}:443/udp"  # HTTP/3
    environment:
      STATUS_DOMAIN: "${STATUS_DOMAIN:?set STATUS_DOMAIN, e.g. status.example.com (use :80 for plain HTTP tests)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  status-data:
  status-cache:
  caddy-data:
  caddy-config:
